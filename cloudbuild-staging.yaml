steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/aquaria-app/aquaria:staging'
      - '.'
    id: 'build-staging'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/aquaria-app/aquaria:staging']
    id: 'push-staging'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'aquaria-app-staging'
      - '--image'
      - 'gcr.io/aquaria-app/aquaria:staging'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
    id: 'deploy-staging'

options:
  logging: CLOUD_LOGGING_ONLY
