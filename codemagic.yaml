workflows:
  ios-workflow:
    name: iOS App Store (AquarIA)
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Apple Developer
    environment:
      groups:
        # Variaveis do app cadastradas na UI do Codemagic
        # (inclui VITE_REVENUECAT_IOS_KEY=appl_...)
        - default
      vars:
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.aquaria.app
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "ios/App/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Logs/Cocoapods/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
